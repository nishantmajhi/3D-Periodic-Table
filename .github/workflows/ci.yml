name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner exits 0 with "SKIP" when it finds no browser, which would
      # read as a pass here, so a skip fails the job.
      # Runs `next build` first, then drives the production build.
      - name: Browser suite
        run: |
          npm run test:browser | tee browser.log
          ! grep -q '^SKIP' browser.log
